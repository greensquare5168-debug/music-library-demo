<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罐頭音樂研究所 · CAR 156</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <div class="brand">🎼 罐頭音樂研究所 <span class="tag">Demo</span></div>
    <div class="sub">資料驅動的專輯頁（由整理資料自動生成）</div>
  </div>
</header>

<main class="wrap">
  <section class="album-card" id="album"></section>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋曲名 / 作曲者 / 使用節目…">
    <div class="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="used">有使用</button>
      <button data-f="change">需改作者</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <ul class="tracks" id="tracks"></ul>

  <section class="excluded">
    <h2>已排除（類型含 Links / 音效）</h2>
    <p class="muted" id="excl-note"></p>
    <ul id="excluded"></ul>
  </section>
</main>

<footer class="wrap muted">
  資料來源：Point Music（音韶）＋ Production Music Wiki ＋ Discogs／Warner Chappell PM　·　Demo by U4
</footer>
<script src="app.js"></script>
</body>
</html>
